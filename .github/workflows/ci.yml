name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://onlinetest:ci-postgres-password@127.0.0.1:5432/onlinetest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: onlinetest
          POSTGRES_USER: onlinetest
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onlinetest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pip-audit (dependencies)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q apps exam_platform manage.py

      - name: Django check
        env:
          DJANGO_SECRET_KEY: ci-django-secret-key-at-least-40-characters-long-x
          DJANGO_DEBUG: "1"
          JWT_SECRET: ci-placeholder-jwt-secret-min-24-chars-long
        run: python manage.py check

      - name: No missing migrations
        env:
          DJANGO_SECRET_KEY: ci-django-secret-key-at-least-40-characters-long-x
          DJANGO_DEBUG: "1"
          JWT_SECRET: ci-placeholder-jwt-secret-min-24-chars-long
        run: python manage.py makemigrations --check --dry-run

      - name: Django check --deploy (prod-like)
        env:
          DJANGO_SECRET_KEY: ci-django-secret-key-at-least-40-characters-long-x
          DJANGO_DEBUG: "0"
          JWT_SECRET: ci-placeholder-jwt-secret-min-24-chars-long
          ALLOWED_HOSTS: api.example.org,127.0.0.1
          CORS_ALLOWED_ORIGINS: https://app.example.org
          CSRF_TRUSTED_ORIGINS: https://app.example.org,https://api.example.org
          DJANGO_SECURE_SSL: "1"
          SECURE_PROXY_SSL_HEADER: X-Forwarded-Proto:https
          REDIS_URL: redis://127.0.0.1:6379/0
          GEMINI_API_KEY: ci-placeholder-gemini-key-for-deploy-check-only
        run: python manage.py check --deploy

      - name: Tests
        env:
          DJANGO_SECRET_KEY: ci-django-secret-key-at-least-40-characters-long-x
          DJANGO_DEBUG: "1"
          JWT_SECRET: ci-placeholder-jwt-secret-min-24-chars-long
          APP_BUILD_REF: ${{ github.sha }}
        run: python manage.py test apps.api.tests -v 1

  realtime-smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://onlinetest:ci-postgres-password@127.0.0.1:5432/onlinetest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: onlinetest
          POSTGRES_USER: onlinetest
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onlinetest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Django ASGI health
        env:
          DJANGO_SECRET_KEY: ci-django-secret-key-at-least-40-characters-long-x
          DJANGO_DEBUG: "1"
          JWT_SECRET: ci-placeholder-jwt-secret-min-24-chars-long
        run: |
          cd backend
          python manage.py migrate --noinput
          python -m uvicorn exam_platform.asgi:application --host 127.0.0.1 --port 8000 &
          sleep 3
          curl -sf http://127.0.0.1:8000/api/health | grep -q ok
