worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;
    # .mjs — ES modul. Standart mime.types da yo'q, `application/octet-stream`
    # bilan kelsa brauzer modul sifatida YUKLAMAYDI (onnxruntime-web ning
    # ort-wasm-*.mjs loader'i shu sabab ishlamay qolardi).
    types {
        text/javascript mjs;
        application/wasm wasm;
    }
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 55m;

    # Silero VAD runtime'i (~13MB wasm) va ONNX modeli (~2.3MB) siqilganda
    # ~5MB ga tushadi. Bir marta yuklanadi va keshlanadi.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/wasm
        application/octet-stream
        image/svg+xml;

    upstream django_api {
        server 127.0.0.1:8000;
    }

    server {
        listen 8080;
        server_name _;

        location /api/ {
            proxy_pass http://django_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900s;
        }

        location /django-admin/ {
            proxy_pass http://django_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://django_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # Silero VAD modeli va ONNX runtime — o'zgarmas fayllar, uzoq keshlansin
        # (talaba har imtihonda 15MB qayta yuklamasin).
        location ~ ^/(models|ort|vad)/ {
            root /app/frontend_dist;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        location / {
            root /app/frontend_dist;
            try_files $uri $uri/ /index.html;
        }
    }
}
